<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Токтогул Базар | Админ панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-wrapper">

    <!-- ===== ХЕЙДЕР ===== -->
    <div class="header-block">
        <div class="header-title-box">
            <div class="header-title-row">
                <h1>Токтогул базар</h1>
                <span class="admin-badge">Админ</span>
            </div>
            <p>Жарнама панель</p>
        </div>
        
        <div class="search-container" id="searchContainer">
            <input type="text" id="adSearchInput" placeholder="Издөө..." oninput="filterAdsLocally()">
            <button class="header-search-btn" onclick="toggleSearchBox()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- ===== СТАТИСТИКА ===== -->
    <div class="stat-block">
        <span class="label" id="counter-label">📊 Жаңы жарнамалар</span>
        <span class="count" id="counter-badge">0</span>
    </div>

    <!-- ===== ЖАРНАМАЛАР (2 КОЛОНКА) ===== -->
    <div id="ads-container">
        <div class="empty-state">
            <p>Жүктөлүүдө...</p>
        </div>
    </div>

</div>

<!-- ===== GLASSMORPHISM МЕНЮ ===== -->
<div class="bottom-dock">
    <div class="nav-container">
        <!-- 1. VIP (Сол тараптагы кадимки баскыч) -->
        <button class="nav-item" id="tab-vip" onclick="switchCategory('vip')">
            <i class="fa-solid fa-crown"></i>
            <span>VIP</span>
        </button>

        <!-- 2. Ортодогу ар дайым туруктуу турган фиолет баскыч (Жаңылар) -->
        <button class="nav-item active" id="tab-pending" onclick="switchCategory('pending')">
            <i class="fa-solid">New</i>
        </button>

        <!-- 3. Ads (Оң тараптагы кадимки баскыч) -->
        <button class="nav-item" id="tab-normal" onclick="switchCategory('normal')">
            <i class="fa-solid fa-bullhorn"></i>
            <span>Ads</span>
        </button>
    </div>
</div>


<!-- ===== МОДАЛКА ===== -->
<div class="image-modal" id="imageModal" onclick="closeImageModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeImageModal()">✕</button>
        <img id="modalImageElement" src="" alt="Чоңойтулган сүрөт">
    </div>
</div>

<script>
    function toggleSearchBox() {
        const container = document.getElementById('searchContainer');
        const input = document.getElementById('adSearchInput');
        container.classList.toggle('active');
        if (container.classList.contains('active')) {
            input.focus();
        } else {
            input.value = '';
            if (typeof filterAdsLocally === 'function') filterAdsLocally();
        }
    }
</script>
<script type="module" src="script.js"></script>
</body>
</html>
